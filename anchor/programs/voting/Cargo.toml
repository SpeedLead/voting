[package]
name = "voting"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "voting"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.0"
solana-hash = { version = "3.0.0", features = ["serde"] }

[dev-dependencies]
anchor-attribute-access-control = "=1.0.0"
anchor-attribute-account = "=1.0.0"
anchor-attribute-constant = "=1.0.0"
anchor-attribute-error = "=1.0.0"
anchor-attribute-event = "=1.0.0"
anchor-attribute-program = "=1.0.0"
anchor-derive-accounts = "=1.0.0"
anchor-derive-serde = "=1.0.0"
anchor-derive-space = "=1.0.0"
anchor-litesvm = "0.4.0"
anchor-syn = "=1.0.0"
solana-shred-version = "=3.0.0"
solana-slot-hashes = "=3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
